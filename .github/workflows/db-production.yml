name: Production DB migration workflow

on:
  workflow_dispatch:
    inputs:
      dry_run_only:
        description: Only run dry-run and save evidence
        required: false
        default: true
        type: boolean
      apply_migrations:
        description: Apply migrations explicitly after review
        required: false
        default: false
        type: boolean
      confirmation:
        description: Type PRODUCTION to confirm this is the production project
        required: true
        default: ''
      reconciliation_confirmation:
        description: Type RECONCILED to confirm the remote migration ledger has been operator-reviewed and reconciled against source_sha
        required: true
        default: ''
      source_sha:
        description: Full 40-character reviewed commit SHA to use for dry-run and apply
        required: true
        type: string

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment: production
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      CONFIRMATION: ${{ inputs.confirmation }}
      RECONCILIATION_CONFIRMATION: ${{ inputs.reconciliation_confirmation }}
    steps:
      - name: Validate source_sha format
        run: |
          set -euo pipefail
          if ! [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a full 40-character commit SHA, got: $SOURCE_SHA"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          # Full history: the migration integrity gate must resolve its
          # approved baseline commit, which a shallow clone cannot guarantee.
          fetch-depth: 0

      - name: Verify checked-out commit matches source_sha exactly
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$SOURCE_SHA" ]; then
            echo "Checked-out HEAD ($actual) does not match the reviewed source_sha ($SOURCE_SHA)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify production identity confirmation
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "PRODUCTION" ]; then
            echo "Production confirmation missing; no migration mutation will run."
            exit 1
          fi

      - name: Verify remote reconciliation attestation
        run: |
          set -euo pipefail
          # remoteReconciliation is structurally BLOCKED_OPERATOR_CONTROLLED —
          # automation can never resolve it. This attestation is the explicit,
          # human-provided gate that stands in for that resolution and is
          # bound to the exact source_sha under review.
          if [ "$RECONCILIATION_CONFIRMATION" != "RECONCILED" ]; then
            echo "Remote migration ledger reconciliation was not confirmed for $SOURCE_SHA; refusing to proceed."
            exit 1
          fi

      - name: Read-only migration history check
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          mkdir -p artifacts/readiness
          npm run db:history:check 2>&1 | tee artifacts/readiness/migration-history-check.log

      - name: Read-only supabase dry run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/readiness
          npx supabase link --project-ref qfqakzmjatszisuqjwon 2>&1 | tee artifacts/readiness/production-link.log
          npx supabase db push --dry-run 2>&1 | tee artifacts/readiness/production-dry-run.log

      - name: Save dry-run evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts/readiness
          printf '{"source_sha":"%s","generated_at":"%s","mode":"dry-run"}\n' "$SOURCE_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > artifacts/readiness/production-db-evidence.json

      - name: Upload dry-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-db-dry-run-${{ inputs.source_sha }}
          path: artifacts/readiness
          if-no-files-found: error

  apply:
    needs: reconcile
    if: ${{ github.event.inputs.apply_migrations == 'true' && github.event.inputs.dry_run_only == 'false' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Validate source_sha format
        run: |
          set -euo pipefail
          if ! [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a full 40-character commit SHA, got: $SOURCE_SHA"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Verify checked-out commit matches source_sha exactly
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$SOURCE_SHA" ]; then
            echo "Checked-out HEAD ($actual) does not match the reviewed source_sha ($SOURCE_SHA)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Re-run migration integrity gate immediately before apply
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          mkdir -p artifacts/readiness
          npm run db:history:check 2>&1 | tee artifacts/readiness/apply-migration-history-check.log

      - name: Apply production migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/readiness
          npx supabase link --project-ref qfqakzmjatszisuqjwon 2>&1 | tee artifacts/readiness/apply-link.log
          npx supabase db push 2>&1 | tee artifacts/readiness/apply-db-push.log

      # Prefer linked Management API verification (SUPABASE_ACCESS_TOKEN) so the
      # workflow stays GREEN without requiring SUPABASE_DB_URL. If SUPABASE_DB_URL
      # is present, also run the legacy psql probe for defense in depth.
      - name: Post-apply ledger and schema verification
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/readiness
          npx supabase link --project-ref qfqakzmjatszisuqjwon 2>&1 | tee artifacts/readiness/post-apply-link.log

          # Ledger: every local migration version must be present remotely.
          npx supabase migration list --linked 2>&1 | tee artifacts/readiness/post-apply-migration-list.log
          if grep -nE '^\s+[0-9]{14}\s+\|\s+\s+\|' artifacts/readiness/post-apply-migration-list.log; then
            echo "Post-apply verification failed: local migrations missing from remote ledger"
            exit 1
          fi
          if ! grep -nE '20260923190000\s+\|\s+20260923190000' artifacts/readiness/post-apply-migration-list.log; then
            # Soft check for expected recent head when present on this SHA; do not
            # fail solely when older SHAs are applied without this version.
            echo "Note: 20260923190000 not found as Local|Remote pair (may be expected on older source_sha)"
          fi

          npx supabase db query --linked -o json "
            select
              to_regclass('public.platform_memberships') is not null as platform_memberships,
              to_regclass('public.profiles') is not null as profiles,
              to_regclass('public.tenant_subscriptions') is not null as tenant_subscriptions,
              to_regclass('public.subscription_payments') is not null as subscription_payments,
              exists(
                select 1 from pg_proc where proname = 'activate_subscription_payment'
              ) as activate_rpc,
              (
                select c.relrowsecurity
                from pg_class c
                join pg_namespace n on n.oid = c.relnamespace
                where n.nspname = 'public' and c.relname = 'subscription_payments'
              ) as subscription_payments_rls;
          " 2>&1 | tee artifacts/readiness/post-apply-verification.log

          python3 - <<'PY'
import json, pathlib, sys
raw = pathlib.Path("artifacts/readiness/post-apply-verification.log").read_text()
start = raw.find("[")
end = raw.rfind("]")
if start < 0 or end < 0:
    print("Post-apply verification failed: no JSON payload")
    sys.exit(1)
row = json.loads(raw[start:end+1])[0]
required = {
  "platform_memberships": True,
  "profiles": True,
  "activate_rpc": True,
  "subscription_payments_rls": True,
}
for key, expected in required.items():
  if row.get(key) is not expected:
    print(f"Post-apply verification failed: {key}={row.get(key)!r}")
    sys.exit(1)
print("schema_probe_ok", row)
PY

          if [ -n "${SUPABASE_DB_URL:-}" ]; then
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 <<'SQL' 2>&1 | tee -a artifacts/readiness/post-apply-verification.log
            DO $$
            DECLARE
              missing_table text;
              unprotected_table text;
            BEGIN
              SELECT t.tbl INTO missing_table
              FROM (VALUES ('platform_memberships'), ('profiles'), ('tenant_subscriptions')) AS t(tbl)
              WHERE to_regclass('public.' || t.tbl) IS NULL
              LIMIT 1;

              IF missing_table IS NOT NULL THEN
                RAISE EXCEPTION 'post-apply verification failed: required table % is missing', missing_table;
              END IF;

              SELECT c.relname INTO unprotected_table
              FROM pg_class c
              JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public'
                AND c.relname IN ('platform_memberships', 'profiles', 'subscription_payments')
                AND c.relrowsecurity = false
              LIMIT 1;

              IF unprotected_table IS NOT NULL THEN
                RAISE EXCEPTION 'post-apply verification failed: table % has row level security disabled', unprotected_table;
              END IF;

              RAISE NOTICE 'post-apply psql verification passed';
            END
            $$;
            SQL
          else
            echo "SUPABASE_DB_URL unset — linked Management API verification used (acceptable)."
          fi

          echo "Post-apply verification passed."

      - name: Save apply evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts/readiness
          printf '{"source_sha":"%s","generated_at":"%s","mode":"apply"}\n' "$SOURCE_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > artifacts/readiness/production-db-apply-evidence.json

      - name: Upload apply evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-db-apply-${{ inputs.source_sha }}
          path: artifacts/readiness
          if-no-files-found: error

