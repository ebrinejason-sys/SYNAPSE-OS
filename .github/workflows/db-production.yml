name: Production DB migration workflow

on:
  workflow_dispatch:
    inputs:
      dry_run_only:
        description: Only run dry-run and save evidence
        required: false
        default: true
        type: boolean
      apply_migrations:
        description: Apply migrations explicitly after review
        required: false
        default: false
        type: boolean
      confirmation:
        description: Type PRODUCTION to confirm this is the production project
        required: true
        default: ''
      source_sha:
        description: Full reviewed commit SHA to use for dry-run and apply
        required: true
        type: string

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify confirmation
        run: |
          if [ "${{ inputs.confirmation }}" != "PRODUCTION" ]; then
            echo "Production confirmation missing; no migration mutation will run."
            exit 1
          fi

      - name: Read-only migration history check
        env:
          CI: 'true'
        run: npm run db:history:check

      - name: Read-only supabase dry run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          mkdir -p artifacts/readiness
          npx supabase link --project-ref qfqakzmjatszisuqjwon 2>&1 | tee artifacts/readiness/production-link.log
          npx supabase db push --dry-run 2>&1 | tee artifacts/readiness/production-dry-run.log

      - name: Save dry-run evidence
        if: always()
        run: |
          mkdir -p artifacts/readiness
          printf '{"source_sha":"%s","generated_at":"%s","mode":"dry-run"}\n' "${{ inputs.source_sha }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > artifacts/readiness/production-db-evidence.json

      - name: Upload dry-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-db-dry-run-${{ inputs.source_sha }}
          path: artifacts/readiness
          if-no-files-found: error

  apply:
    needs: reconcile
    if: ${{ github.event.inputs.apply_migrations == 'true' && github.event.inputs.dry_run_only == 'false' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply production migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx supabase link --project-ref qfqakzmjatszisuqjwon
          npx supabase db push

      - name: Post-apply schema verification
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Missing SUPABASE_DB_URL for remote schema/RLS verification"
            exit 1
          fi
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT to_regclass('public.facility_invitations') IS NOT NULL AS facility_invitations_present;
          SELECT c.relname, c.relrowsecurity
          FROM pg_class c
          JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE n.nspname = 'public'
            AND c.relname IN ('facility_invitations', 'platform_memberships', 'profiles');
          SQL

      - name: Upload apply evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-db-apply-${{ inputs.source_sha }}
          path: artifacts/readiness
          if-no-files-found: warn
