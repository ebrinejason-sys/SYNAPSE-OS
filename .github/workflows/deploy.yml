name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Vercel production deploy: connect this repo in the Vercel dashboard (Git integration).
# Root vercel.json is the source of truth for install/build/output — same as `npm run verify:web`.
# Optional: set VERCEL_TOKEN and keep the deploy job below for CLI-based deploys instead of Git integration.

env:
  VERCEL_ORG_ID: team_ZHaBdLFb1hunAs68QC70HTBy
  VERCEL_PROJECT_ID: prj_ST72DC6VkMfhon3M1yW2PL575mcd

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify migrations (local SQL checks)
        run: npm run db:check

      - name: Verify web build (matches vercel.json)
        run: npm run verify:web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: https://synapseos.tech
          SYNAPSE_JWT_SECRET: ${{ secrets.SYNAPSE_JWT_SECRET }}

      - name: Verify pharmacy (type-check, lint, tenant-authz + spine safety tests, build)
        run: npm run verify:pharmacy
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SYNAPSE_JWT_SECRET: ${{ secrets.SYNAPSE_JWT_SECRET }}
          NEXT_PUBLIC_PHARMACY_APP_URL: https://pharm.synapseos.tech

      - name: Type-check Expo app (Release 0 equal citizen)
        run: npm run type-check --workspace @synapse/app

      - name: Export Expo Android bundle
        run: npm run export:android --workspace @synapse/app

      - name: Lint web app
        run: npm run lint --workspace @synapse/web

  # Apply reviewed production migrations before acceptance. A missing access
  # token blocks protected main rather than testing against stale schema.
  db-migrations:
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Link production Supabase project
        run: npx supabase link --project-ref qfqakzmjatszisuqjwon
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Review pending migrations
        run: npx supabase db push --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply production migrations
        run: npx supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # Protected-main acceptance gate. This remains fail-closed: a missing or
  # partial database configuration must stop the release before deployment.
  db-acceptance:
    needs: [verify, db-migrations]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Require database credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_SERVICE_ROLE_KEY" ]]; then
            echo "Protected-main database acceptance requires SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY"
            exit 1
          fi

      - name: Run database-backed pharmacy acceptance
        run: npm run test --workspace @synapse/pharmacy
        env:
          CI: "true"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SYNAPSE_JWT_SECRET: ${{ secrets.SYNAPSE_JWT_SECRET }}

      - name: Verify migration and schema compatibility checks
        run: npm run db:check

  # Optional CLI deploy. Prefer Vercel Git integration for www/pharm production.
  # Enable with repository variable ENABLE_VERCEL_CLI_DEPLOY=true and secret VERCEL_TOKEN.
  # Note: secrets cannot be referenced in job-level `if` — use a repo variable gate instead.
  deploy-vercel:
    needs: [verify, db-migrations, db-acceptance]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && vars.ENABLE_VERCEL_CLI_DEPLOY == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Pull Vercel env (production)
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build with Vercel CLI (same as dashboard)
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: https://synapseos.tech

      - name: Deploy prebuilt output
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  # Enable by setting repository variable ENABLE_DB_PUSH=true and secret SUPABASE_ACCESS_TOKEN
  db-push:
    needs: [verify, db-migrations, db-acceptance]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && vars.ENABLE_DB_PUSH == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Link Supabase project
        run: npx supabase link --project-ref qfqakzmjatszisuqjwon
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push migrations (dry-run first)
        run: npx supabase db push --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push migrations
        run: npx supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
