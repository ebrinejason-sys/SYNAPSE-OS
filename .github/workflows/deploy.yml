name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# Never reference secrets in job-level `if` — GitHub then fails the workflow
# in 0s with no jobs, which made CI look absent on recent main SHAs.

jobs:
  deploy-vercel:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Require VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN unset — skip CLI deploy (Vercel Git integration still deploys)."
            exit 0
          fi
          echo "vercel_token=present" >> "$GITHUB_ENV"

      - name: Install and deploy
        if: env.vercel_token == 'present'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_ZHaBdLFb1hunAs68QC70HTBy
          VERCEL_PROJECT_ID: prj_ST72DC6VkMfhon3M1yW2PL575mcd
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: https://synapseos.tech
        run: |
          npm ci
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel build --prod --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  db-push:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Guard ENABLE_DB_PUSH
        env:
          ENABLE_DB_PUSH: ${{ vars.ENABLE_DB_PUSH }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ "$ENABLE_DB_PUSH" != "true" ]; then
            echo "ENABLE_DB_PUSH is not true — skip db push."
            exit 0
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN unset — cannot push."
            exit 1
          fi
          echo "db_push=present" >> "$GITHUB_ENV"
      - name: Push migrations
        if: env.db_push == 'present'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npm ci
          npx supabase link --project-ref qfqakzmjatszisuqjwon
          npx supabase db push --dry-run
          npx supabase db push
